name: Deploy to Production

# Production is deploy-on-demand: staging goes out automatically on every push
# to main (see cicd.yml), production only when you trigger this workflow.
on:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy to Production"
        required: true
        type: boolean
        default: true

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: inputs.deploy_production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Production
        run: flyctl deploy -c fly-production.toml --remote-only --depot=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }}
