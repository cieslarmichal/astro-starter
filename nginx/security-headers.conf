# Included wherever a `location` block needs these: nginx does not inherit
# `add_header` from a parent scope into a location that sets any `add_header`
# of its own, so every location below that sets Cache-Control has to pull
# these back in explicitly or lose them for that traffic.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
