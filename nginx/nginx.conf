# Replace example.com everywhere below with your real domain before deploying.

# www -> apex redirect: www.example.com must not serve a duplicate copy of
# the site under a second hostname. Delete this block if you actually want
# www to be the canonical host instead - just flip which one redirects.
server {
    listen 8080;
    server_name www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 8080 default_server;
    server_name example.com;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Strip trailing slash on clean URLs, e.g. /oferta/ -> /oferta. Guarded on
    # $request_uri (fixed for the life of the request) rather than $uri, so
    # it fires only for the client's actual request and not for try_files'
    # own internal $uri/ -> directory/index.html rewrite below.
    if ($request_uri ~ ^(?<trimmed_uri>/.+)/(?<trimmed_qs>\?.*)?$) {
        return 301 $trimmed_uri$trimmed_qs;
    }

    # Cache static assets for a year - Astro content-hashes filenames under
    # /_astro/, and everything else here is images/video/fonts that only
    # change when you replace the file, so this is safe.
    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|svg|css|js|woff|woff2|ttf|eot|mp4|webm|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # @astrojs/sitemap (see astro.config.mjs) writes sitemap-index.xml and
    # sitemap-0.xml directly - nothing to hand-maintain here.
    location ~* ^/sitemap.*\.xml$ {
        access_log off;
        log_not_found off;
    }

    # Prerendered 404 page. Reached only via error_page below, so the
    # response keeps a real 404 status instead of nginx's SPA fallback
    # (which would otherwise return 200 for every unknown path).
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    error_page 404 /404.html;

    # Homepage, served explicitly as a file so it isn't subject to the same
    # directory-vs-file handling as the routes below.
    location = / {
        try_files /index.html =404;
    }

    # Every route is a flat <route>.html file at build time (see
    # astro.config.mjs's build.format: 'file'), so no SPA fallback to
    # /index.html is needed here - unknown paths correctly 404. $uri.html
    # (not $uri/) on purpose: matching an on-disk directory here would make
    # nginx 301 to add a trailing slash before it could even look for that
    # directory's index.html, turning every route into a redirect chain.
    location / {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }
}
